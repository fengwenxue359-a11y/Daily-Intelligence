<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日智囊 2.0</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #1e3a8a; --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; color: var(--text); }
        header { background: var(--primary); color: white; padding: 15px; position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .category-nav { display: flex; overflow-x: auto; gap: 10px; padding: 15px 15px 5px 15px; }
        .category-nav button { padding: 8px 16px; border-radius: 20px; border: none; background: #e5e7eb; color: #4b5563; white-space: nowrap; font-size: 14px; }
        .category-nav button.active { background: var(--primary); color: white; font-weight: bold; }
        .container { padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 18px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .card .tag { font-size: 11px; background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 4px; }
        .title-cn { font-size: 16px; font-weight: bold; margin: 10px 0 5px 0; }
        .title-en { font-size: 13px; color: #6b7280; margin-bottom: 10px; }
        .summary-cn { font-size: 14px; color: #374151; line-height: 1.5; margin-bottom: 8px; }
        .summary-en { font-size: 13px; color: #9ca3af; line-height: 1.4; margin-bottom: 12px; font-style: italic; }
        .link-btn { font-size: 13px; color: var(--primary); text-decoration: none; font-weight: bold; }
        .note-section { background: var(--card); border-radius: 12px; padding: 20px; margin-top: 20px; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; resize: none; box-sizing: border-box; }
        .save-btn { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; margin-top: 10px; font-weight: bold; }
        .loading { text-align: center; padding: 50px; color: #6b7280; }
    </style>
</head>
<body>
    <header>
        <h1><span>📰 每日智囊</span> <select id="historySelect" style="background:transparent; color:white; border:none; font-size:14px;"></select></h1>
    </header>
    
    <div class="category-nav" id="categoryNav">
        <button class="active" data-category="全部">全部</button>
        <button data-category="财经">财经股市</button>
        <button data-category="AI科技">AI科技</button>
        <button data-category="书籍">书籍阅读</button>
        <button data-category="成长视频">成长视频</button>
    </div>

    <div class="container" id="content"><div class="loading">正在加载情报...</div></div>

    <div class="container">
        <div class="note-section">
            <h2>📝 我的学习笔记</h2>
            <textarea id="noteInput" placeholder="写下你今天对这些信息的思考..."></textarea>
            <button class="save-btn" onclick="saveNote()">保存笔记</button>
            <p id="saveStatus" style="color: var(--primary); font-size: 12px; text-align: center; display: none;">✔ 笔记已保存</p>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
        let currentData = [];
        let currentDate = 'latest';
        let currentCategory = '全部';

        async function loadData(date = 'latest') {
            currentDate = date;
            document.getElementById('content').innerHTML = '<div class="loading">加载中...</div>';
            const url = date === 'latest' ? './briefs/latest.json' : `./briefs/archive/${date}.json`;
            try {
                const res = await fetch(`${url}?t=${Date.now()}`);
                const data = await res.json();
                currentData = data.items || [];
                render();
                loadNote(date);
            } catch(e) { document.getElementById('content').innerHTML = '<div class="loading" style="color:red;">⚠️ 数据未生成，请检查Actions</div>'; }
        }

        function render() {
            let html = '';
            const filtered = currentCategory === '全部' ? currentData : currentData.filter(i => i.category === currentCategory);
            filtered.forEach(item => {
                html += `
                    <div class="card">
                        <span class="tag">${item.category}</span> <span style="font-size:12px; color:#9ca3af;">${item.source}</span>
                        <div class="title-cn">${item.title_cn}</div>
                        <div class="title-en">${item.title_en}</div>
                        <div class="summary-cn">${item.summary_cn}</div>
                        <div class="summary-en">${item.summary_en}</div>
                        <a class="link-btn" href="${item.original_link}" target="_blank">阅读原文 →</a>
                    </div>
                `;
            });
            document.getElementById('content').innerHTML = html || '<div class="loading">此分类下暂无情报</div>';
        }

        document.getElementById('categoryNav').addEventListener('click', (e) => {
            if(e.target.tagName === 'BUTTON') {
                document.querySelectorAll('.category-nav button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                render();
            }
        });

        async function loadHistory() {
            try {
                const res = await fetch(`./briefs/history.json?t=${Date.now()}`);
                const history = await res.json();
                const select = document.getElementById('historySelect');
                history.forEach(d => { const opt = document.createElement('option'); opt.value = d; opt.text = d; select.appendChild(opt); });
            } catch(e) { }
        }

        function loadNote(date) { document.getElementById('noteInput').value = localStorage.getItem(`intel_note_${date}`) || ''; }
        function saveNote() { 
            localStorage.setItem(`intel_note_${currentDate}`, document.getElementById('noteInput').value); 
            const s = document.getElementById('saveStatus'); s.style.display='block'; setTimeout(()=>s.style.display='none', 2000);
        }

        document.getElementById('historySelect').addEventListener('change', (e) => loadData(e.target.value));
        loadHistory();
        loadData('latest');
    </script>
</body>
</html>
